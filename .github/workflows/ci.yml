name: CI

on:
  pull_request:
  push:
    branches: [main, "integration/**"]

permissions:
  contents: read

jobs:
  quick:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: fuspi
          POSTGRES_PASSWORD: fuspi
          POSTGRES_DB: fuspi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fuspi -d fuspi_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://fuspi:fuspi@127.0.0.1:5432/fuspi_test?connection_limit=10
      SEED_ADMIN_EMAIL: ci-admin@example.invalid
      SEED_ADMIN_PASSWORD: ci-only-password-change-me
      AUTH_URL: http://localhost:3004
      AUTH_SECRET: ci-only-auth-secret-at-least-32-bytes
      TOKEN_HMAC_SECRET: ci-only-token-secret-at-least-32-bytes
      IP_HASH_SECRET: ci-only-ip-secret-at-least-32-bytes
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run prisma:validate
      - run: npx prisma migrate deploy
      - run: npm run prisma:seed
      - run: npm run prisma:seed
      - run: npm run test
      - run: npm run test:integration
      - run: npm run build
