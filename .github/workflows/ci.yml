name: CI

on:
  pull_request:
  push:
    branches: [main, "integration/**"]

permissions:
  contents: read

jobs:
  quick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run prisma:validate
        env:
          DATABASE_URL: mysql://fuspi:fuspi@127.0.0.1:3306/fuspi_test
      - run: npm run test
      - run: npm run build
        env:
          DATABASE_URL: mysql://fuspi:fuspi@127.0.0.1:3306/fuspi_test
