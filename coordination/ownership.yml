version: 1
coordinator: gpt
lanes:
  gpt:
    owns:
      - package.json
      - package-lock.json
      - prisma/**
      - .github/**
      - src/contracts/**
      - src/lib/auth/**
      - src/lib/security/**
      - src/lib/storage/**
      - src/features/tickets/**
      - src/features/booking/**
      - src/proxy.ts
  claude:
    owns:
      - src/app/[locale]/(public)/**
      - src/components/public/**
      - src/components/ui/**
      - src/app/globals.css
      - messages/**
  deepseek:
    owns:
      - src/app/[locale]/admin/content/**
      - src/components/admin/**
      - src/features/content/**
      - scripts/migration/**
      - src/**/*.test.ts
hotspots:
  single_writer: gpt
  paths:
    - package.json
    - package-lock.json
    - prisma/**
    - .env.example
    - next.config.ts
    - src/proxy.ts
    - src/contracts/**
    - src/config/navigation.ts
    - .github/**
ui_hotspots:
  single_writer: claude
  paths:
    - src/app/globals.css
    - src/components/ui/**
    - messages/**
active_leases:
  - task: M4-GPT-ENTRY-AND-ASSIGNMENT
    owner: gpt
    paths:
      - coordination/ownership.yml
      - coordination/milestones/M4-FEATURES-ENTRY.md
      - coordination/tasks/M4-GPT-ENTRY-AND-ASSIGNMENT.md
      - coordination/tasks/M4-GPT-PPKS-QUERY-ISOLATION.md
      - coordination/tasks/M4-CLAUDE-PUBLIC-SHELL-HARDENING.md
      - coordination/tasks/M4-DEEPSEEK-PAGE-DOMAIN-CRUD.md
      - coordination/prompts/M4-CLAUDE-PUBLIC-SHELL-HARDENING.md
      - coordination/prompts/M4-DEEPSEEK-PAGE-DOMAIN-CRUD.md
      - coordination/handoffs/M4-GPT-ENTRY-AND-ASSIGNMENT-gpt.md
