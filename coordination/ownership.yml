version: 1
coordinator: human
lanes:
  gpt:
    owns:
      - package.json
      - package-lock.json
      - prisma/**
      - .github/**
      - src/contracts/**
      - src/lib/auth/**
      - src/lib/security/**
      - src/lib/storage/**
      - src/features/tickets/**
      - src/features/booking/**
      - src/proxy.ts
  claude:
    owns:
      - src/app/[locale]/(public)/**
      - src/components/public/**
      - src/components/ui/**
      - src/app/globals.css
      - messages/**
  deepseek:
    owns:
      - src/app/[locale]/admin/content/**
      - src/components/admin/**
      - src/features/content/**
      - scripts/migration/**
      - src/**/*.test.ts
hotspots:
  single_writer: gpt
  paths:
    - package.json
    - package-lock.json
    - prisma/**
    - .env.example
    - next.config.ts
    - src/proxy.ts
    - src/contracts/**
    - src/config/navigation.ts
    - .github/**
ui_hotspots:
  single_writer: claude
  paths:
    - src/app/globals.css
    - src/components/ui/**
    - messages/**
active_leases:
  - task: M3-GPT-PUBLIC-IA-MANUAL-CONTENT-CONTRACT
    owner: gpt
    paths:
      - docs/README.md
      - docs/05-halaman-publik.md
      - docs/07-upload-media-hostinger.md
      - docs/10-menu-branding-referensi.md
      - docs/13-celah-fitur-keamanan-operasional.md
      - docs/16-audit-kelengkapan.md
      - docs/18-beranda-editable.md
      - docs/20-test-acceptance-go-live.md
      - docs/24-implementation-plan-multi-model.md
      - docs/26-fuspi-public-ia-design-brief.md
