version: 1
coordinator: human
lanes:
  gpt:
    owns:
      - package.json
      - package-lock.json
      - prisma/**
      - .github/**
      - src/contracts/**
      - src/lib/auth/**
      - src/lib/security/**
      - src/lib/storage/**
      - src/features/tickets/**
      - src/features/booking/**
      - src/proxy.ts
  claude:
    owns:
      - src/app/[locale]/(public)/**
      - src/components/public/**
      - src/components/ui/**
      - src/app/globals.css
      - messages/**
  deepseek:
    owns:
      - src/app/[locale]/admin/content/**
      - src/components/admin/**
      - src/features/content/**
      - scripts/migration/**
      - src/**/*.test.ts
hotspots:
  single_writer: gpt
  paths:
    - package.json
    - package-lock.json
    - prisma/**
    - .env.example
    - next.config.ts
    - src/proxy.ts
    - src/contracts/**
    - src/config/navigation.ts
    - .github/**
ui_hotspots:
  single_writer: claude
  paths:
    - src/app/globals.css
    - src/components/ui/**
    - messages/**
active_leases:
  - task: M2-GPT-POSTGRESQL-PLATFORM-MIGRATION
    owner: gpt
    paths: ["package.json", "package-lock.json", "prisma/**", "src/lib/db/**", ".env.example", ".github/workflows/ci.yml", "README.md", "docs/{README,01-arsitektur,02-database-schema,07-upload-media-hostinger,08-deploy-hostinger,09-fitur-cms-editor,13-celah-fitur-keamanan-operasional,20-test-acceptance-go-live,24-implementation-plan-multi-model,25-m0-foundation-capability}.md", "coordination/adr/ADR-0003-postgresql-vps-platform.md", "coordination/milestones/{M1-CODE-COMPLETE,M2-EXIT-GATE-AND-M3-ENTRY}.md", "tests/**db*.test.ts", "tests/**/**.integration.test.ts", "coordination/handoffs/M2-GPT-POSTGRESQL-PLATFORM-MIGRATION-gpt.md"]
  - task: M2-CLAUDE-PASSWORD-SESSION-UI
    owner: claude
    paths: ["src/app/[locale]/(auth)/**", "src/app/[locale]/admin/**", "src/components/auth/**", "src/components/ui/field.tsx", "src/components/ui/label.tsx", "src/components/ui/separator.tsx", "messages/id.json", "messages/en.json", "messages/ar.json", "e2e/auth/password-session.spec.ts", "coordination/handoffs/M2-CLAUDE-PASSWORD-SESSION-UI-claude.md"]
  - task: M2-DEEPSEEK-AUTH-BRIDGE-REVIEW
    owner: deepseek
    paths: ["tests/security/auth-bridge/**", "coordination/reviews/M2-GPT-AUTH-BRIDGE-deepseek.md", "coordination/handoffs/M2-DEEPSEEK-AUTH-BRIDGE-REVIEW-deepseek.md"]
