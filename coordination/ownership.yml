version: 1
coordinator: human
lanes:
  gpt:
    owns:
      - package.json
      - package-lock.json
      - prisma/**
      - .github/**
      - src/contracts/**
      - src/lib/auth/**
      - src/lib/security/**
      - src/lib/storage/**
      - src/features/tickets/**
      - src/features/booking/**
      - src/proxy.ts
  claude:
    owns:
      - src/app/[locale]/(public)/**
      - src/components/public/**
      - src/components/ui/**
      - src/app/globals.css
      - messages/**
  deepseek:
    owns:
      - src/app/[locale]/admin/content/**
      - src/components/admin/**
      - src/features/content/**
      - scripts/migration/**
      - src/**/*.test.ts
hotspots:
  single_writer: gpt
  paths:
    - package.json
    - package-lock.json
    - prisma/**
    - .env.example
    - next.config.ts
    - src/proxy.ts
    - src/contracts/**
    - src/config/navigation.ts
    - .github/**
ui_hotspots:
  single_writer: claude
  paths:
    - src/app/globals.css
    - src/components/ui/**
    - messages/**
active_leases:
  - task: M2-GPT-THREAT-REGISTRY-RECONCILIATION
    owner: gpt
    paths:
      - tests/security/m2-threat-plan.ts
      - tests/security/m2-threat-plan.test.ts
      - coordination/milestones/M2-EXIT-GATE-AND-M3-ENTRY.md
      - coordination/reviews/M2-EXIT-GATE-EVIDENCE-gpt.md
      - coordination/handoffs/M2-GPT-THREAT-REGISTRY-RECONCILIATION-gpt.md
