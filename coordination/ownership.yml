version: 1
coordinator: gpt
lanes:
  gpt:
    owns:
      - package.json
      - package-lock.json
      - prisma/**
      - .github/**
      - src/contracts/**
      - src/lib/auth/**
      - src/lib/security/**
      - src/lib/storage/**
      - src/features/tickets/**
      - src/features/booking/**
      - src/proxy.ts
  claude:
    owns:
      - src/app/[locale]/(public)/**
      - src/components/public/**
      - src/components/ui/**
      - src/app/globals.css
      - messages/**
  deepseek:
    owns:
      - src/app/[locale]/admin/content/**
      - src/components/admin/**
      - src/features/content/**
      - scripts/migration/**
      - src/**/*.test.ts
hotspots:
  single_writer: gpt
  paths:
    - package.json
    - package-lock.json
    - prisma/**
    - .env.example
    - next.config.ts
    - src/proxy.ts
    - src/contracts/**
    - src/config/navigation.ts
    - .github/**
ui_hotspots:
  single_writer: claude
  paths:
    - src/app/globals.css
    - src/components/ui/**
    - messages/**
active_leases:
  - task: M3-GPT-MEDIA-FOCUS-ORDER-CORRECTION
    owner: gpt
    paths:
      - e2e/m3/admin-media-library-browse.spec.ts
  - task: M3-GPT-AUTOSAVE-MUTATION-SERIALIZATION
    owner: gpt
    paths:
      - src/components/admin/posts/post-editor-shell.tsx
      - src/components/admin/posts/post-editor-form.tsx
      - src/components/admin/posts/post-publication-actions.tsx
      - src/components/admin/posts/post-delete-action.tsx
      - tests/m3/ui/admin-post-autosave.test.tsx
      - tests/m3/ui/admin-post-editor.test.tsx
      - e2e/m3/admin-post-editor.spec.ts
  - task: M3-GPT-BUILD-TRACING-WARNING-R3
    owner: gpt
    paths:
      - src/lib/storage/staged-file.ts
      - coordination/handoffs/M3-GPT-BUILD-TRACING-WARNING-R3-gpt.md
  - task: M3-GPT-PROCESS-RECONCILIATION-AND-EXIT
    owner: gpt
    paths:
      - coordination/ownership.yml
      - coordination/tasks/M3-GPT-PROCESS-RECONCILIATION-AND-EXIT.md
      - coordination/tasks/M3-GPT-BUILD-TRACING-WARNING-R3.md
      - coordination/tasks/M3-GPT-CLAUDE-OPERATIONAL-CONTROL.md
