version: 1
coordinator: human
lanes:
  gpt:
    owns:
      - package.json
      - package-lock.json
      - prisma/**
      - .github/**
      - src/contracts/**
      - src/lib/auth/**
      - src/lib/security/**
      - src/lib/storage/**
      - src/features/tickets/**
      - src/features/booking/**
      - src/proxy.ts
  claude:
    owns:
      - src/app/[locale]/(public)/**
      - src/components/public/**
      - src/components/ui/**
      - src/app/globals.css
      - messages/**
  deepseek:
    owns:
      - src/app/[locale]/admin/content/**
      - src/components/admin/**
      - src/features/content/**
      - scripts/migration/**
      - src/**/*.test.ts
hotspots:
  single_writer: gpt
  paths:
    - package.json
    - package-lock.json
    - prisma/**
    - .env.example
    - next.config.ts
    - src/proxy.ts
    - src/contracts/**
    - src/config/navigation.ts
    - .github/**
ui_hotspots:
  single_writer: claude
  paths:
    - src/app/globals.css
    - src/components/ui/**
    - messages/**
active_leases:
  - task: M2-GPT-AUTH-CONTRACT
    owner: gpt
    paths: ["package.json", "package-lock.json", ".env.example", "src/contracts/auth.ts", "src/lib/auth/permission-matrix.ts", "tests/platform/auth-contracts/**", "coordination/adr/ADR-0002-auth-dependency-contract.md"]
  - task: M2-CLAUDE-AUTH-UX-SPEC-REVISION
    owner: claude
    paths: ["coordination/reviews/M2-AUTH-UX-SPEC-claude.md", "coordination/handoffs/M2-CLAUDE-AUTH-UX-SPEC-claude.md"]
  - task: M2-REVIEW-GPT-AUTH-CONTRACT
    owner: deepseek
    paths: ["coordination/reviews/M2-GPT-AUTH-CONTRACT-deepseek.md", "coordination/handoffs/M2-REVIEW-GPT-AUTH-CONTRACT-deepseek.md"]
