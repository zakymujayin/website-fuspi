version: 1
coordinator: human
lanes:
  gpt:
    owns:
      - package.json
      - package-lock.json
      - prisma/**
      - .github/**
      - src/contracts/**
      - src/lib/auth/**
      - src/lib/security/**
      - src/lib/storage/**
      - src/features/tickets/**
      - src/features/booking/**
      - src/proxy.ts
  claude:
    owns:
      - src/app/[locale]/(public)/**
      - src/components/public/**
      - src/components/ui/**
      - src/app/globals.css
      - messages/**
  deepseek:
    owns:
      - src/app/[locale]/admin/content/**
      - src/components/admin/**
      - src/features/content/**
      - scripts/migration/**
      - src/**/*.test.ts
hotspots:
  single_writer: gpt
  paths:
    - package.json
    - package-lock.json
    - prisma/**
    - .env.example
    - next.config.ts
    - src/proxy.ts
    - src/contracts/**
    - src/config/navigation.ts
    - .github/**
ui_hotspots:
  single_writer: claude
  paths:
    - src/app/globals.css
    - src/components/ui/**
    - messages/**
active_leases:
  - task: M3-CLAUDE-MEDIA-LIBRARY-BROWSE
    owner: claude
    paths:
      - src/app/[locale]/admin/media/page.tsx
      - src/app/[locale]/admin/media/loading.tsx
      - src/components/admin/media/**
      - messages/id.json
      - messages/en.json
      - messages/ar.json
      - tests/m3/ui/admin-media-library-browse.test.tsx
      - coordination/handoffs/M3-CLAUDE-MEDIA-LIBRARY-BROWSE-claude.md
  - task: M3-DEEPSEEK-MEDIA-LIBRARY-BROWSE-QA
    owner: deepseek
    paths:
      - e2e/m3/admin-media-library-browse.spec.ts
      - coordination/reviews/M3-CLAUDE-MEDIA-LIBRARY-BROWSE-deepseek.md
      - coordination/handoffs/M3-DEEPSEEK-MEDIA-LIBRARY-BROWSE-QA-deepseek.md
