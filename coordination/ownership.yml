version: 1
coordinator: gpt
lanes:
  gpt:
    owns:
      - package.json
      - package-lock.json
      - prisma/**
      - .github/**
      - src/contracts/**
      - src/lib/auth/**
      - src/lib/security/**
      - src/lib/storage/**
      - src/features/tickets/**
      - src/features/booking/**
      - src/proxy.ts
  claude:
    owns:
      - src/app/[locale]/(public)/**
      - src/components/public/**
      - src/components/ui/**
      - src/app/globals.css
      - messages/**
  deepseek:
    owns:
      - src/app/[locale]/admin/content/**
      - src/components/admin/**
      - src/features/content/**
      - scripts/migration/**
      - src/**/*.test.ts
hotspots:
  single_writer: gpt
  paths:
    - package.json
    - package-lock.json
    - prisma/**
    - .env.example
    - next.config.ts
    - src/proxy.ts
    - src/contracts/**
    - src/config/navigation.ts
    - .github/**
ui_hotspots:
  single_writer: claude
  paths:
    - src/app/globals.css
    - src/components/ui/**
    - messages/**
active_leases:
  - task: M4-GPT-HOME-NAV-DOMAINS
    owner: gpt
    paths:
      - src/features/home-nav/**
      - tests/m4/runtime/home-nav*.test.ts
      - tests/m4/runtime/home-nav*.integration.test.ts
      - tests/security/home-nav*.integration.test.ts
      - coordination/handoffs/M4-GPT-HOME-NAV-DOMAINS-gpt.md
  - task: M4-CLAUDE-PAGE-ADMIN-UI
    owner: claude
    paths:
      - src/app/[locale]/admin/layout.tsx
      - src/app/[locale]/admin/pages/**
      - src/components/admin/pages/**
      - messages/id.json
      - messages/en.json
      - messages/ar.json
      - tests/m4/ui/page-admin/**
      - e2e/m4/page-admin.spec.ts
      - coordination/handoffs/M4-CLAUDE-PAGE-ADMIN-UI-claude.md
  - task: M4-GPT-PUBLIC-IA-MENU-REMAP
    owner: gpt
    paths:
      - AGENTS.md
      - docs/README.md
      - docs/02-database-schema.md
      - docs/05-halaman-publik.md
      - docs/17-komponen-ui-detail.md
      - docs/20-test-acceptance-go-live.md
      - docs/22-calon-mahasiswa-akademik-discoverability.md
      - docs/24-implementation-plan-multi-model.md
      - docs/26-fuspi-public-ia-design-brief.md
      - src/components/public/nav-items.ts
      - src/components/public/site-header.tsx
      - src/components/public/nav-items.test.ts
      - src/app/[locale]/(public)/akademik/page.tsx
      - src/app/[locale]/(public)/sitemap/page.tsx
      - src/app/sitemap.ts
      - messages/id.json
      - messages/en.json
      - messages/ar.json
      - coordination/tasks/M4-GPT-PUBLIC-IA-MENU-REMAP.md
      - coordination/handoffs/M4-GPT-PUBLIC-IA-MENU-REMAP-gpt.md
      - coordination/ownership.yml
