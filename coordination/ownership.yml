version: 1
coordinator: human
lanes:
  gpt:
    owns:
      - package.json
      - package-lock.json
      - prisma/**
      - .github/**
      - src/contracts/**
      - src/lib/auth/**
      - src/lib/security/**
      - src/lib/storage/**
      - src/features/tickets/**
      - src/features/booking/**
      - src/proxy.ts
  claude:
    owns:
      - src/app/[locale]/(public)/**
      - src/components/public/**
      - src/components/ui/**
      - src/app/globals.css
      - messages/**
  deepseek:
    owns:
      - src/app/[locale]/admin/content/**
      - src/components/admin/**
      - src/features/content/**
      - scripts/migration/**
      - src/**/*.test.ts
hotspots:
  single_writer: gpt
  paths:
    - package.json
    - package-lock.json
    - prisma/**
    - .env.example
    - next.config.ts
    - src/proxy.ts
    - src/contracts/**
    - src/config/navigation.ts
    - .github/**
ui_hotspots:
  single_writer: claude
  paths:
    - src/app/globals.css
    - src/components/ui/**
    - messages/**
active_leases:
  - task: M3-GPT-CLAUDE-OPERATIONAL-CONTROL
    owner: gpt
    paths:
      - coordination/adr/ADR-0004-claude-operational-control-handoff.md
      - coordination/ownership.yml
      - coordination/handoffs/M3-GPT-CLAUDE-OPERATIONAL-CONTROL-gpt.md
  - task: M3-GPT-MEDIA-FOCUS-ORDER-CORRECTION
    owner: gpt
    paths:
      - e2e/m3/admin-media-library-browse.spec.ts
  - task: M3-GPT-AUTOSAVE-MUTATION-SERIALIZATION
    owner: gpt
    paths:
      - src/components/admin/posts/post-editor-shell.tsx
      - src/components/admin/posts/post-editor-form.tsx
      - src/components/admin/posts/post-publication-actions.tsx
      - src/components/admin/posts/post-delete-action.tsx
      - tests/m3/ui/admin-post-autosave.test.tsx
      - tests/m3/ui/admin-post-editor.test.tsx
      - e2e/m3/admin-post-editor.spec.ts
  - task: M3-DEEPSEEK-BUILD-TRACING-REVIEW
    owner: deepseek
    paths:
      - coordination/reviews/M3-GPT-BUILD-TRACING-WARNING-deepseek.md
  - task: M3-DEEPSEEK-AUTOSAVE-SERIALIZATION-REVIEW
    owner: deepseek
    paths:
      - coordination/reviews/M3-GPT-AUTOSAVE-MUTATION-SERIALIZATION-deepseek.md
      - coordination/handoffs/M3-DEEPSEEK-AUTOSAVE-SERIALIZATION-REVIEW-deepseek.md
  - task: M3-DEEPSEEK-MEDIA-FOCUS-ORDER-REVIEW
    owner: deepseek
    paths:
      - coordination/reviews/M3-GPT-MEDIA-FOCUS-ORDER-CORRECTION-deepseek.md
      - coordination/handoffs/M3-DEEPSEEK-MEDIA-FOCUS-ORDER-REVIEW-deepseek.md
