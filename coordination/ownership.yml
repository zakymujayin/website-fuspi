version: 1
coordinator: gpt
lanes:
  gpt:
    owns:
      - package.json
      - package-lock.json
      - prisma/**
      - .github/**
      - src/contracts/**
      - src/lib/auth/**
      - src/lib/security/**
      - src/lib/storage/**
      - src/features/tickets/**
      - src/features/booking/**
      - src/proxy.ts
  claude:
    owns:
      - src/app/[locale]/(public)/**
      - src/components/public/**
      - src/components/ui/**
      - src/app/globals.css
      - messages/**
  deepseek:
    owns:
      - src/app/[locale]/admin/content/**
      - src/components/admin/**
      - src/features/content/**
      - scripts/migration/**
      - src/**/*.test.ts
hotspots:
  single_writer: gpt
  paths:
    - package.json
    - package-lock.json
    - prisma/**
    - .env.example
    - next.config.ts
    - src/proxy.ts
    - src/contracts/**
    - src/config/navigation.ts
    - .github/**
ui_hotspots:
  single_writer: claude
  paths:
    - src/app/globals.css
    - src/components/ui/**
    - messages/**
active_leases:
  - task: M4-GPT-PUBLIC-CONTENT-SCHEMA-CORRECTION
    owner: gpt
    paths:
      - prisma/schema.prisma
      - prisma/migrations/20260804194500_public_content_schema_correction/**
      - src/generated/prisma/**
      - tests/m4/schema/public-content-schema.test.ts
      - tests/m4/schema/public-content-schema.integration.test.ts
      - coordination/handoffs/M4-GPT-PUBLIC-CONTENT-SCHEMA-CORRECTION-gpt.md
  - task: M4-CLAUDE-PAGE-ADMIN-UI
    owner: claude
    paths:
      - src/app/[locale]/admin/layout.tsx
      - src/app/[locale]/admin/pages/**
      - src/components/admin/pages/**
      - messages/id.json
      - messages/en.json
      - messages/ar.json
      - tests/m4/ui/page-admin/**
      - e2e/m4/page-admin.spec.ts
      - coordination/handoffs/M4-CLAUDE-PAGE-ADMIN-UI-claude.md
