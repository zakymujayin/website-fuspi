version: 1
coordinator: gpt
lanes:
  gpt:
    owns:
      - package.json
      - package-lock.json
      - prisma/**
      - .github/**
      - src/contracts/**
      - src/lib/auth/**
      - src/lib/security/**
      - src/lib/storage/**
      - src/features/tickets/**
      - src/features/booking/**
      - src/proxy.ts
  claude:
    owns:
      - src/app/[locale]/(public)/**
      - src/components/public/**
      - src/components/ui/**
      - src/app/globals.css
      - messages/**
  deepseek:
    owns:
      - src/app/[locale]/admin/content/**
      - src/components/admin/**
      - src/features/content/**
      - scripts/migration/**
      - src/**/*.test.ts
hotspots:
  single_writer: gpt
  paths:
    - package.json
    - package-lock.json
    - prisma/**
    - .env.example
    - next.config.ts
    - src/proxy.ts
    - src/contracts/**
    - src/config/navigation.ts
    - .github/**
ui_hotspots:
  single_writer: claude
  paths:
    - src/app/globals.css
    - src/components/ui/**
    - messages/**
active_leases:
  - task: M4-GPT-PPKS-QUERY-ISOLATION
    owner: gpt
    paths:
      - src/contracts/ticket.ts
      - src/features/tickets/**
      - src/lib/tickets/**
      - tests/m4/tickets/**
      - coordination/handoffs/M4-GPT-PPKS-QUERY-ISOLATION-gpt.md
  - task: M4-CLAUDE-PUBLIC-SHELL-HARDENING
    owner: claude
    paths:
      - src/app/[locale]/(public)/layout.tsx
      - src/components/public/site-header.tsx
      - src/components/public/site-footer.tsx
      - src/components/public/desktop-nav.tsx
      - src/components/public/mobile-nav.tsx
      - src/components/public/language-switcher.tsx
      - src/components/public/brand-mark.tsx
      - src/components/public/skip-link.tsx
      - src/components/public/shell/**
      - messages/id.json
      - messages/en.json
      - messages/ar.json
      - tests/m4/ui/public-shell-hardening.test.tsx
      - e2e/m4/public-shell-hardening.spec.ts
      - coordination/handoffs/M4-CLAUDE-PUBLIC-SHELL-HARDENING-claude.md
  - task: M4-DEEPSEEK-PAGE-DOMAIN-CRUD
    owner: deepseek
    paths:
      - src/features/content/pages/**
      - tests/m4/content/pages/**
      - coordination/handoffs/M4-DEEPSEEK-PAGE-DOMAIN-CRUD-deepseek.md
